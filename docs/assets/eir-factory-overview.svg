<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">EIR evidence-led startup factory</title>
  <desc id="desc">A five-phase summary groups the detailed eight-stage workflow that turns a rough startup idea into a decision and test plan. An evidence ledger supports every phase, and experiments feed learning back into the next cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#102e43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d0aa"/>
      <stop offset="1" stop-color="#67b7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020c13" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67b7ff"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{fill:#10283a;stroke:#2c5168;stroke-width:1.5}
      .num{fill:#071a2b;stroke:#31d0aa;stroke-width:2}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#75e5ca}
      .stage{font-size:22px;font-weight:750;fill:#f4fbff}
      .body{font-size:14px;fill:#b9ccda}
      .label{font-size:14px;font-weight:700;fill:#e9f7ff}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="190" fill="#31d0aa" opacity=".055"/>
  <circle cx="80" cy="670" r="210" fill="#67b7ff" opacity=".05"/>
  <g class="sans">
    <text x="64" y="70" class="eyebrow">EIR · FIVE MACRO PHASES OF THE EIGHT-STAGE FACTORY</text>
    <text x="64" y="111" font-size="32" font-weight="780" fill="#f4fbff">From an interesting idea to a decision you can test</text>
    <text x="64" y="143" font-size="16" fill="#a9c2d2">Every claim keeps its source and confidence. Every verdict ends in an experiment.</text>
    <g filter="url(#shadow)">
      <rect class="card" x="64" y="196" width="196" height="188" rx="18"/>
      <text x="88" y="232" class="eyebrow">MACRO PHASE</text>
      <text x="88" y="274" class="stage">Frame</text>
      <text x="88" y="306" class="body">Problem · ICP · urgency</text>
      <text x="88" y="331" class="body">Founder claims stay</text>
      <text x="88" y="352" class="body">separate from facts.</text>

      <rect class="card" x="280" y="196" width="196" height="188" rx="18"/>
      <text x="304" y="232" class="eyebrow">MACRO PHASE</text>
      <text x="304" y="274" class="stage">Research</text>
      <text x="304" y="306" class="body">Primary sources first</text>
      <text x="304" y="331" class="body">Dated notes expose</text>
      <text x="304" y="352" class="body">gaps and conflicts.</text>

      <rect class="card" x="496" y="196" width="196" height="188" rx="18"/>
      <text x="520" y="232" class="eyebrow">MACRO PHASE</text>
      <text x="520" y="274" class="stage">Analyze</text>
      <text x="520" y="306" class="body">Product · market · GTM</text>
      <text x="520" y="331" class="body">Turn evidence into</text>
      <text x="520" y="352" class="body">a narrow thesis.</text>

      <rect class="card" x="712" y="196" width="196" height="188" rx="18"/>
      <text x="736" y="232" class="eyebrow">MACRO PHASE</text>
      <text x="736" y="274" class="stage">Challenge</text>
      <text x="736" y="306" class="body">Contradictions · risks</text>
      <text x="736" y="331" class="body">Ask what would kill</text>
      <text x="736" y="352" class="body">or reverse the thesis.</text>

      <rect x="928" y="196" width="208" height="188" rx="18" fill="#123348" stroke="url(#accent)" stroke-width="2"/>
      <text x="952" y="232" class="eyebrow">MACRO PHASE</text>
      <text x="952" y="274" class="stage">Decide</text>
      <text x="952" y="306" class="body">Invest · Watch · Pass</text>
      <text x="952" y="331" class="body">Confidence plus the</text>
      <text x="952" y="352" class="body">next decisive test.</text>
    </g>

    <g stroke="#67b7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)" opacity=".9">
      <path d="M260 290 H274"/>
      <path d="M476 290 H490"/>
      <path d="M692 290 H706"/>
      <path d="M908 290 H922"/>
    </g>

    <rect x="64" y="430" width="1072" height="92" rx="18" fill="#0b2132" stroke="#29495d"/>
    <rect x="64" y="430" width="8" height="92" rx="4" fill="url(#accent)"/>
    <text x="96" y="466" class="label">EVIDENCE LEDGER</text>
    <text x="96" y="494" class="body">user-provided</text>
    <circle cx="216" cy="489" r="3" fill="#506d7e"/>
    <text x="231" y="494" class="body">confirmed</text>
    <circle cx="324" cy="489" r="3" fill="#506d7e"/>
    <text x="339" y="494" class="body">inferred</text>
    <circle cx="416" cy="489" r="3" fill="#506d7e"/>
    <text x="431" y="494" class="body">unknown</text>
    <text x="1120" y="466" text-anchor="end" font-size="13" font-weight="700" fill="#75e5ca">SOURCE + DATE + CONFIDENCE</text>
    <text x="1120" y="494" text-anchor="end" class="body">Source count never replaces relevance and verification.</text>

    <rect x="250" y="566" width="700" height="62" rx="31" fill="#10283a" stroke="#315970"/>
    <circle cx="289" cy="597" r="18" fill="#31d0aa" opacity=".16"/>
    <path d="M281 597 l6 6 11-13" fill="none" stroke="#75e5ca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="322" y="593" class="label">Experiment → learning → next cycle</text>
    <text x="322" y="614" class="body">Smallest decisive test · success metric · owner · stop rule</text>
    <path d="M950 597 C1060 597 1090 545 1090 522" stroke="#67b7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M250 597 C150 597 112 545 112 523" stroke="#31d0aa" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
